# Daily / swing profile — extends default intraday settings.
extends: default.yaml

data:
  bar_interval: 1d
  poll_interval_sec: 60

rules:
  pair_spread:
    window_sec: 86400
    spread_entry_pct: 1.0
    spread_exit_pct: 0.3

  point_breakout:
    threshold_pts: 200
    exit_threshold_pts: 100

backtest:
  min_bars: 60
