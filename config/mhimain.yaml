# Structured logging (mhimain CLI)
logging:
  level: INFO       # DEBUG | INFO | WARNING | ERROR
  format: text      # json | text (key=value lines)
  file: logs/mhimain.jsonl   # append JSON lines; set empty to disable
  stdout: true      # also print to console / journalctl

# Futu OpenD connection
futu:
  host: 127.0.0.1
  port: 11111

mhimain:
  # Futu code: HK.MHImain (auto front-month) or explicit month e.g. HK.MHI2607
  symbol: HK.MHImain

  # LTD: trade normally until 11:58 HKT, then roll in-position to next month; front flips 17:15
  contract_rollover: true
  rollover_on_last_trade_day: true

  # Session trend when not passed via --trend (options: bull | bear | uncertain)
  #   bull       — only open long; close long for profit / cut loss
  #   bear       — only open short; close short for profit / cut loss
  #   uncertain  — price < MA5 → long; price > MA5 → short
  default_trend: uncertain

  ma_period: 20              # daily MA length for uncertain entries
  ma_refresh_sec: 3600        # refresh daily MA before uncertain entry (min interval, 10 min)

  # P/L exits from entry price (per contract): cut at -cut_loss_pts, profit at +take_profit_pts
  cut_loss_pts: 240         # close when P/L is launch − 200 pts
  take_profit_pts: 400      # close when P/L is launch + 400 pts
  cut_loss_min_hold_hours: 24  # no cut loss until position held this long (take profit still allowed)

  # Re-entry block after any exit; clears when ALL apply:
  reentry_minimum_hours: 4   #   always wait at least this long (even if price moves enough)
  reentry_move_pts: 240      #   then price moves 300 pts from exit, or
  reentry_trading_hours: 24   #   reentry_trading_hours elapse (whichever clears first after minimum)

  # Panic pause: block cut loss (not take profit) after a violent move
  panic_move_pts: 150
  panic_window_sec: 120
  panic_wait_min: 30

  # Paper vs live — single switch
  #   SIMULATE — routes orders to Futu sim account via OpenFutureTradeContext
  #   REAL     — live futures account (requires trade unlock at startup)
  trd_env: REAL

  # Trade password for REAL unlock (optional — leave empty to prompt interactively).
  # Non-interactive/systemd: set FUTU_TRADE_PASSWORD env instead of storing here.
  trade_password:
  trade_unlock_valid_days: 21   # flatten open position, then lock orders; prompt password to continue

  # Market orders only if |last_price − bid/ask| < this (points)
  max_market_slippage_pts: 4

  # Re-sync broker position from Futu and print snapshot every N seconds
  position_refresh_sec: 2

  # Idle outside HKEX MHI hours (HKT): no quotes, orders, or broker refresh
  respect_hkex_hours: true
  idle_poll_sec: 60   # wake interval while idle to detect session open
  # After session open, ignore overnight/pre-session data_time for entry staleness (sec)
  session_open_grace_sec: 300   # 30 min — covers 09:15–09:45 morning open

  # Flat entries blocked 09:15–09:45 when |day open − prior night close| >= this (index pts)
  morning_gap_blackout_pts: 240

data:
  poll_interval_sec: 2      # seconds between quote polls
  poll_display_threshold_pts: 40  # only print status when price moves this many pts

risk:
  # Max net contracts (entry book + legs); reject orders that would exceed |total|
  max_position_shares: 4
  # Kill switch: stop trading if account equity drops by this % from session day-start baseline
  max_daily_loss_pct: 50.0
  # Fallback when OpenD accinfo unavailable at startup (HKD total_assets)
  # account_equity:

  # Stale threshold = poll_interval_sec × this value (seconds)
  # Blocks new entries when poll gap OR quote data_time age exceeds threshold
  stale_poll_multiplier: 30.0
